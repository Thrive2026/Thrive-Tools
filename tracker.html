<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flagged Notes Tracker — Thrive Peer Recovery Services</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f5f7;color:#1a1a2e;min-height:100vh;}
.header{background:#fff;border-bottom:4px solid #4B5EA6;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.header-left{display:flex;align-items:center;gap:16px;}
.header img{height:48px;width:auto;}
.header-text h1{font-size:18px;font-weight:700;color:#4B5EA6;}
.header-text p{font-size:12px;color:#888;margin-top:2px;}
.who{font-size:13px;color:#2d2d4e;text-align:right;}
.who strong{color:#4B5EA6;}
.signout-btn{background:none;border:1.5px solid #dde0f0;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;color:#666;cursor:pointer;margin-left:12px;}
.signout-btn:hover{border-color:#E8417A;color:#E8417A;}
.main{max-width:1100px;margin:32px auto;padding:0 20px 60px;}

/* login */
.login-wrap{max-width:400px;margin:80px auto;background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,0.1);padding:32px;}
.login-wrap h2{font-size:18px;font-weight:700;color:#4B5EA6;margin-bottom:6px;}
.login-wrap p{font-size:13px;color:#888;margin-bottom:20px;line-height:1.5;}
.login-wrap label{display:block;font-size:13px;font-weight:600;color:#2d2d4e;margin-bottom:6px;margin-top:14px;}
.login-wrap input{width:100%;border:1.5px solid #dde0f0;border-radius:8px;padding:10px 14px;font-size:14px;color:#1a1a2e;font-family:inherit;background:#fafbff;}
.login-wrap input:focus{outline:none;border-color:#4B5EA6;background:#fff;}
.login-btn{width:100%;margin-top:20px;padding:12px;background:#4B5EA6;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.login-btn:hover{background:#3a4d8f;}
.login-btn:disabled{background:#b0b8d8;cursor:not-allowed;}
.login-error{margin-top:14px;font-size:13px;color:#8B1A1A;background:#FDECEA;border:1.5px solid #f5c6c6;border-radius:8px;padding:10px 12px;display:none;}
.login-error.visible{display:block;}

/* filters */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.filter-tab{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #dde0f0;background:#fff;color:#555;}
.filter-tab.active{background:#4B5EA6;border-color:#4B5EA6;color:#fff;}
.filter-spacer{flex:1;}
.refresh-btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid #4B5EA6;background:#fff;color:#4B5EA6;}
.refresh-btn:hover{background:#EEF1FB;}

/* cards */
.note-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.07);margin-bottom:14px;overflow:hidden;border-left:5px solid #dde0f0;}
.note-card.concern{border-left-color:#E8417A;}
.note-card.itp{border-left-color:#F5C518;}
.note-card.reviewed{opacity:0.6;}
.note-top{padding:16px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.note-meta{font-size:13px;color:#2d2d4e;line-height:1.7;}
.note-meta .client{font-weight:700;font-size:14px;color:#1a1a2e;}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-right:6px;margin-top:4px;}
.badge-concern{background:#FDECEA;color:#8B1A1A;}
.badge-itp{background:#FFF8E6;color:#7A5200;}
.badge-reviewed{background:#F0FAF2;color:#1A5A2A;}
.badge-rejected{background:#FDECEA;color:#8B1A1A;}
.badge-escalated{background:#F3E8FF;color:#6B21A8;}
.reject-reason-box{font-size:11px;color:#8B1A1A;background:#FDECEA;border-radius:6px;padding:6px 10px;margin-top:6px;}
.concern-types{margin-top:6px;}
.concern-types span{display:inline-block;background:#f4f5f7;color:#555;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;margin-right:5px;margin-top:4px;}
.note-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
.mark-btn{padding:8px 18px;background:#4B5EA6;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.mark-btn:hover{background:#3a4d8f;}
.mark-btn:disabled{background:#b0b8d8;cursor:not-allowed;}
.action-row{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.action-btn{padding:7px 16px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.action-btn.approve{background:#1A7A3A;color:#fff;}
.action-btn.approve:hover{background:#146030;}
.action-btn.reject{background:#E8417A;color:#fff;}
.action-btn.reject:hover{background:#c92f63;}
.action-btn.escalate{background:#6B21A8;color:#fff;}
.action-btn.escalate:hover{background:#551a86;}
.action-btn:disabled{background:#b0b8d8;cursor:not-allowed;}
.escalated-tag{font-size:11px;font-weight:700;color:#6B21A8;margin-top:4px;}
.reviewed-note{font-size:11px;color:#1A5A2A;text-align:right;}
.empty-state{text-align:center;padding:60px 20px;color:#888;}
.empty-state p{font-size:14px;}
.loading-state{text-align:center;padding:40px;color:#4B5EA6;font-size:13px;}
.view-toggle{background:none;border:1.5px solid #dde0f0;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:600;color:#4B5EA6;cursor:pointer;margin-top:8px;}
.view-toggle:hover{background:#EEF1FB;}
.note-content{display:none;border-top:1px solid #eee;padding:16px 20px;background:#fafbff;}
.note-content.visible{display:block;}
.note-content h4{font-size:12px;font-weight:700;color:#4B5EA6;margin-bottom:4px;margin-top:14px;}
.note-content h4:first-child{margin-top:0;}
.note-content p{font-size:13px;color:#2d2d2d;line-height:1.6;white-space:pre-wrap;}
.email-block{border-top:1px solid #eee;margin-top:16px;padding-top:14px;}
.email-block label{display:block;font-size:11px;font-weight:600;color:#2d2d4e;margin-bottom:5px;}
.email-block textarea{width:100%;border:1.5px solid #dde0f0;border-radius:6px;padding:8px 10px;font-size:12px;font-family:inherit;resize:vertical;min-height:50px;margin-bottom:8px;}
.email-btn{padding:7px 16px;background:#4B5EA6;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;}
.email-btn:hover{background:#3a4d8f;}
.email-btn:disabled{background:#b0b8d8;cursor:not-allowed;}
.email-hint{font-size:11px;color:#888;margin-top:6px;}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ── SUPABASE CONFIG ──
// Same project as dap-note.html, but the tracker authenticates as a logged-in
// reviewer rather than using the anon insert-only key, so RLS scopes reads
// and updates to what that reviewer is allowed to see.
const SUPABASE_URL = 'https://fussjixekyhwuromauff.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1c3NqaXhla3lod3Vyb21hdWZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MjMzNzYsImV4cCI6MjA5ODI5OTM3Nn0.3yfRu5LMDlIasvc0cu_GOcXAquji6ZYUkp3dgxk1j2M';
const TABLE = 'dap_note_analytics';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentReviewer = null; // { name, role, divisions }
let currentFilter = 'unreviewed'; // 'unreviewed' | 'concern' | 'itp' | 'all'
let allNotes = [];

const app = document.getElementById('app');

// ── RENDER: LOGIN ──
function renderLogin(errorMsg) {
  app.innerHTML = `
    <div class="header">
      <div class="header-left">
        <img src="/thrive-icon.png" alt="Thrive Peer Recovery Services"/>
        <div class="header-text">
          <h1>Flagged Notes Tracker</h1>
          <p>Thrive Peer Recovery Services &nbsp;&middot;&nbsp; Supervisor / Clinical Review</p>
        </div>
      </div>
    </div>
    <div class="login-wrap">
      <h2>Sign In</h2>
      <p>Access is restricted to clinical/community leadership and division directors. Contact Brandon if you need an account.</p>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@thrivepeerrecoveryservices.com"/>
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••"/>
      <button class="login-btn" id="loginBtn">Sign In</button>
      <div class="login-error ${errorMsg ? 'visible' : ''}" id="loginError">${errorMsg || ''}</div>
    </div>
  `;
  document.getElementById('loginBtn').onclick = handleLogin;
  document.getElementById('loginPassword').addEventListener('keydown', function(e){
    if (e.key === 'Enter') handleLogin();
  });
}

async function handleLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var password = document.getElementById('loginPassword').value;
  var btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  var { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });
  if (error) {
    renderLogin('Sign-in failed: ' + error.message);
    return;
  }

  var reviewerLookup = await sb.from('reviewers').select('name, role, divisions').eq('id', data.user.id).single();
  if (reviewerLookup.error || !reviewerLookup.data) {
    renderLogin('Signed in, but no reviewer profile is set up for this account yet. Contact Brandon to be added to the reviewers table.');
    await sb.auth.signOut();
    return;
  }

  currentReviewer = reviewerLookup.data;
  await loadAndRenderDashboard();
}

async function handleSignOut() {
  await sb.auth.signOut();
  currentReviewer = null;
  renderLogin();
}

// ── RENDER: DASHBOARD ──
async function loadAndRenderDashboard() {
  renderShell(true);
  var { data, error } = await sb
    .from(TABLE)
    .select('*')
    .or('concern_flagged.eq.true,itp_flagged.eq.true')
    .order('session_date', { ascending: false });

  if (error) {
    app.innerHTML += '<div class="main"><div class="empty-state"><p>Error loading notes: ' + error.message + '</p></div></div>';
    return;
  }

  allNotes = data || [];
  renderShell(false);
}

function renderShell(loading) {
  var scopeLabel = currentReviewer.role === 'org_wide' ? 'All Divisions' : (currentReviewer.divisions || []).join(', ');
  app.innerHTML = `
    <div class="header">
      <div class="header-left">
        <img src="/thrive-icon.png" alt="Thrive Peer Recovery Services"/>
        <div class="header-text">
          <h1>Flagged Notes Tracker</h1>
          <p>Thrive Peer Recovery Services &nbsp;&middot;&nbsp; Supervisor / Clinical Review</p>
        </div>
      </div>
      <div class="who">
        Signed in as <strong>${currentReviewer.name}</strong><br/>
        <span style="font-size:11px;color:#888;">Scope: ${scopeLabel}</span>
        <button class="signout-btn" id="signOutBtn">Sign Out</button>
      </div>
    </div>
    <div class="main">
      <div class="filter-bar">
        <div class="filter-tab" data-filter="unreviewed">Needs Review</div>
        <div class="filter-tab" data-filter="escalated">Escalated</div>
        <div class="filter-tab" data-filter="concern">Concern Flags</div>
        <div class="filter-tab" data-filter="itp">ITP Flags</div>
        <div class="filter-tab" data-filter="all">All (incl. Reviewed)</div>
        <div class="filter-spacer"></div>
        <button class="refresh-btn" id="refreshBtn">&#8635; Refresh</button>
      </div>
      <div id="notesList">${loading ? '<div class="loading-state">Loading flagged notes...</div>' : ''}</div>
    </div>
  `;
  document.getElementById('signOutBtn').onclick = handleSignOut;
  document.getElementById('refreshBtn').onclick = loadAndRenderDashboard;
  document.querySelectorAll('.filter-tab').forEach(function(tab){
    tab.onclick = function(){ currentFilter = tab.getAttribute('data-filter'); renderNotesList(); };
  });
  if (!loading) renderNotesList();
}

function renderNotesList() {
  document.querySelectorAll('.filter-tab').forEach(function(tab){
    tab.classList.toggle('active', tab.getAttribute('data-filter') === currentFilter);
  });

  var filtered = allNotes.filter(function(n){
    if (currentFilter === 'unreviewed') return !n.reviewed;
    if (currentFilter === 'escalated') return n.escalated;
    if (currentFilter === 'concern') return n.concern_flagged;
    if (currentFilter === 'itp') return n.itp_flagged;
    return true; // 'all'
  });

  var listEl = document.getElementById('notesList');
  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty-state"><p>Nothing here. ' + (currentFilter === 'unreviewed' ? 'All caught up \u2014 no unreviewed flags in your scope.' : 'No notes match this filter.') + '</p></div>';
    return;
  }

  listEl.innerHTML = filtered.map(renderNoteCard).join('');
  filtered.forEach(function(note){
    var approveBtn = document.getElementById('approveBtn_' + note.id);
    if (approveBtn) approveBtn.onclick = function(){ resolveNote(note.id, 'approved'); };

    var rejectBtn = document.getElementById('rejectBtn_' + note.id);
    if (rejectBtn) rejectBtn.onclick = function(){ rejectNote(note); };

    var escalateBtn = document.getElementById('escalateBtn_' + note.id);
    if (escalateBtn) escalateBtn.onclick = function(){ escalateNote(note.id); };

    var toggleBtn = document.getElementById('viewToggle_' + note.id);
    var contentDiv = document.getElementById('noteContent_' + note.id);
    if (toggleBtn && contentDiv) {
      toggleBtn.onclick = function(){
        var nowVisible = contentDiv.classList.toggle('visible');
        toggleBtn.textContent = nowVisible ? 'Hide Note' : 'View Note & Contact Provider';
      };
    }

    var emailBtn = document.getElementById('emailBtn_' + note.id);
    if (emailBtn) {
      emailBtn.onclick = function(){ emailProvider(note); };
    }
  });
}

async function resolveNote(noteId, outcome) {
  var btn = document.getElementById(outcome === 'approved' ? 'approveBtn_' + noteId : 'rejectBtn_' + noteId);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  var { error } = await sb
    .from(TABLE)
    .update({
      reviewed: true,
      reviewed_by: currentReviewer.name,
      reviewed_date: new Date().toISOString(),
      review_outcome: outcome
    })
    .eq('id', noteId);

  if (error) {
    alert('Could not save: ' + error.message);
    if (btn) { btn.disabled = false; btn.textContent = outcome === 'approved' ? 'Approve' : 'Reject'; }
    return;
  }
  await loadAndRenderDashboard();
}

async function rejectNote(note) {
  var reason = prompt('Why is this note being rejected? (This will be logged and can be included in the email to the provider.)');
  if (reason === null) return; // cancelled
  reason = reason.trim();

  var btn = document.getElementById('rejectBtn_' + note.id);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  var { error } = await sb
    .from(TABLE)
    .update({
      reviewed: true,
      reviewed_by: currentReviewer.name,
      reviewed_date: new Date().toISOString(),
      review_outcome: 'rejected',
      reject_reason: reason || null
    })
    .eq('id', note.id);

  if (error) {
    alert('Could not save: ' + error.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Reject'; }
    return;
  }

  if (note.provider_email) {
    var wantsEmail = confirm('Note marked as rejected. Send an email to ' + (note.provider_name || 'the provider') + ' now?');
    if (wantsEmail) {
      emailProvider(Object.assign({}, note, { _rejectReason: reason }));
    }
  }

  await loadAndRenderDashboard();
}

async function escalateNote(noteId) {
  var btn = document.getElementById('escalateBtn_' + noteId);
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  var { error } = await sb
    .from(TABLE)
    .update({
      escalated: true,
      escalated_by: currentReviewer.name,
      escalated_date: new Date().toISOString()
    })
    .eq('id', noteId);

  if (error) {
    alert('Could not escalate: ' + error.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Escalate'; }
    return;
  }
  await loadAndRenderDashboard();
}

function emailProvider(note) {
  var msgEl = document.getElementById('emailMsg_' + note.id);
  var msg = msgEl ? msgEl.value.trim() : '';
  var subject = 'Follow-up needed: ' + (note.client_number || 'note') + ' (' + (note.program || '') + ')';
  var flagType = note.concern_flagged ? 'a concern flag' : 'an ITP flag';
  var dateStr = note.session_date ? new Date(note.session_date + 'T00:00:00').toLocaleDateString() : 'an unspecified date';
  var reasonLine = note._rejectReason ? ('This note was reviewed and needs revision. Reason: ' + note._rejectReason + '\n\n') : '';
  var body = 'Hi ' + (note.provider_name || '') + ',\n\n'
    + 'I was reviewing the flagged notes tracker and wanted to follow up on the note for client ' + (note.client_number || '(no client number)')
    + ' in ' + (note.program || 'your program') + ', session date ' + dateStr + ', which has ' + flagType + '.\n\n'
    + reasonLine
    + (msg ? (msg + '\n\n') : '')
    + 'Could you take another look at this note in Pimsy when you get a chance?\n\n'
    + 'Thanks,\n' + (currentReviewer ? currentReviewer.name : '');
  var mailto = 'mailto:' + encodeURIComponent(note.provider_email)
    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body);
  window.location.href = mailto;
}

function renderNoteCard(note) {
  var cardClass = 'note-card' + (note.reviewed ? ' reviewed' : (note.concern_flagged ? ' concern' : ' itp'));
  var badges = '';
  if (note.concern_flagged) badges += '<span class="badge badge-concern">Concern Flag</span>';
  if (note.itp_flagged) badges += '<span class="badge badge-itp">ITP Flag</span>';
  if (note.escalated) badges += '<span class="badge badge-escalated">Escalated</span>';
  if (note.reviewed && note.review_outcome === 'approved') badges += '<span class="badge badge-reviewed">Approved</span>';
  if (note.reviewed && note.review_outcome === 'rejected') badges += '<span class="badge badge-rejected">Rejected</span>';

  var concernTypesHtml = '';
  if (note.concern_type && note.concern_type.length) {
    concernTypesHtml = '<div class="concern-types">' + note.concern_type.map(function(t){ return '<span>' + escapeHtml(t) + '</span>'; }).join('') + '</div>';
  }

  var dateStr = note.session_date ? new Date(note.session_date + 'T00:00:00').toLocaleDateString() : '—';
  var codeLabel = note.linkage_code ? (' &middot; ' + escapeHtml(note.linkage_code)) : '';
  var providerLine = note.provider_name ? ('PRS: ' + escapeHtml(note.provider_name) + '<br/>') : '';

  var reasonHtml = (note.review_outcome === 'rejected' && note.reject_reason)
    ? '<div class="reject-reason-box">Reject reason: ' + escapeHtml(note.reject_reason) + '</div>' : '';
  var escalatedNoteHtml = note.escalated
    ? '<div class="escalated-tag">Escalated by ' + escapeHtml(note.escalated_by || '—') + (note.escalated_date ? (' on ' + new Date(note.escalated_date).toLocaleDateString()) : '') + '</div>' : '';

  var actionsHtml;
  if (note.reviewed) {
    actionsHtml = '<div class="reviewed-note">' + (note.review_outcome === 'rejected' ? 'Rejected' : 'Approved') + ' by ' + escapeHtml(note.reviewed_by || '—')
      + '<br/>' + (note.reviewed_date ? new Date(note.reviewed_date).toLocaleString() : '') + '</div>' + reasonHtml;
  } else {
    actionsHtml = '<div class="action-row">'
      + '<button class="action-btn approve" id="approveBtn_' + note.id + '">Approve</button>'
      + '<button class="action-btn reject" id="rejectBtn_' + note.id + '">Reject</button>'
      + (note.escalated ? '' : '<button class="action-btn escalate" id="escalateBtn_' + note.id + '">Escalate</button>')
      + '</div>' + escalatedNoteHtml;
  }

  var hasNoteText = note.description_text || note.assessment_text || note.plan_text;
  var noteContentHtml = hasNoteText ? `
    <h4>Description of Session</h4>
    <p>${escapeHtml(note.description_text || '—')}</p>
    <h4>Assessment of Progress</h4>
    <p>${escapeHtml(note.assessment_text || '—')}</p>
    <h4>Plans for Follow-Up</h4>
    <p>${escapeHtml(note.plan_text || '—')}</p>
  ` : '<p style="font-size:12px;color:#888;">No note content was logged for this entry.</p>';

  var emailBlockHtml = note.provider_email ? `
    <div class="email-block">
      <label>Message to ${escapeHtml(note.provider_name || 'provider')} (optional)</label>
      <textarea id="emailMsg_${note.id}" placeholder="e.g. Can you take another look at the Assessment section on this one?"></textarea>
      <button class="email-btn" id="emailBtn_${note.id}">Email Provider</button>
      <div class="email-hint">Opens your email client addressed to the PRS. Note content itself is not included in the email &mdash; reference only, per PHI handling policy.</div>
    </div>
  ` : '<div class="email-block"><p style="font-size:12px;color:#888;">No provider email on file for this note.</p></div>';

  return `
    <div class="${cardClass}">
      <div class="note-top">
        <div class="note-meta">
          <span class="client">${escapeHtml(note.client_number || 'No client #')}</span> &middot; ${escapeHtml(note.program || '—')}${codeLabel}<br/>
          ${providerLine}
          Session date: ${dateStr}<br/>
          ${badges}
          ${concernTypesHtml}
          <br/><button class="view-toggle" id="viewToggle_${note.id}">View Note &amp; Contact Provider</button>
        </div>
        <div class="note-actions">
          ${actionsHtml}
        </div>
      </div>
      <div class="note-content" id="noteContent_${note.id}">
        ${noteContentHtml}
        ${emailBlockHtml}
      </div>
    </div>
  `;
}



function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// ── INIT: check for existing session ──
(async function init() {
  var { data } = await sb.auth.getSession();
  if (data && data.session) {
    var reviewerLookup = await sb.from('reviewers').select('name, role, divisions').eq('id', data.session.user.id).single();
    if (!reviewerLookup.error && reviewerLookup.data) {
      currentReviewer = reviewerLookup.data;
      await loadAndRenderDashboard();
      return;
    }
  }
  renderLogin();
})();
